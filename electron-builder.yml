appId: com.omniplay.launcher
productName: OmniPlay
directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - assets/**/*

asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OmniPlay
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  artifactName: "OmniPlay-Setup.exe"
  uninstallDisplayName: "${productName}"
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

appx:
  applicationId: OmniPlay
  displayName: "OmniPlay"
  identityName: "PriyankBhatt.OmniPlay"
  publisher: "CN=617F1400-0C02-4F7A-A289-8C7A11ED006C"
  publisherDisplayName: "Priyank Bhatt"
  backgroundColor: "#0d0f12"
  showNameOnTiles: true
