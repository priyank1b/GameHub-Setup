appId: com.gamehub.launcher
productName: GameHub
directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - assets/**/*

asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"

win:
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GameHub
  artifactName: "GameHub-Setup.exe"
